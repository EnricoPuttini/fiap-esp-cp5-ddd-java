name: Build CP5

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projeto: [fiap-bank-core-bancario, fiap-bank-plataforma-credito]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn clean install (${{ matrix.projeto }})
        working-directory: ${{ matrix.projeto }}
        run: mvn -B clean install
