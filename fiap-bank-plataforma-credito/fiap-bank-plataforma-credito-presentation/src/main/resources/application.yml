server:
  port: 8081

spring:
  application:
    name: fiap-bank-plataforma-credito
  datasource:
    url: jdbc:h2:mem:plataformacreditodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

core:
  bancario:
    url: ${CORE_BANCARIO_URL:http://localhost:8080/api/v1}
